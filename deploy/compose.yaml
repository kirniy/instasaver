services:
  api:
    image: aiogram/telegram-bot-api@sha256:a6cbb08dd181df11bbe4dc71ab8d74a6c97e0c1fa148f5c7c617affca42de9ef
    container_name: instasaver-api
    restart: unless-stopped
    user: "${INSTASAVER_UID}:${INSTASAVER_GID}"
    entrypoint: ["telegram-bot-api"]
    command: ["--local", "--http-port=8081", "--dir=/api", "--temp-dir=/api/tmp", "--verbosity=0"]
    env_file: /opt/instasaver/secrets/api.env
    ports: ["127.0.0.1:8091:8081"]
    volumes:
      - /opt/instasaver/api:/api
      - /opt/instasaver/data:/opt/instasaver/data:ro
    mem_limit: 768m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

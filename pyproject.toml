[project]
name = "instasaver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12",
    "gallery-dl>=1.32.12",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
instasaver = "instasaver.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
